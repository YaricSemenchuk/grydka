[package]
name = "gryadka"
version = "1.0.0"
description = "Грядка — облік магазину насіння"
edition = "2021"

[lib]
name = "gryadka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
